server:
  port: 8091

spring:
  application:
    name: seata-server

logging:
  config: classpath:logback-spring.xml
  file:
    name: ${logHome}/logs/seata-server.log
  level:
    io:
      seata: info

seata:
  config:
    # 配置中心相关设置
    type: file
  registry:
    # 注册中心相关设置
    type: file
  store:
    # 事务会话信息存储方式
    mode: file
    file:
      dir: file_store/data
  server:
    # 服务相关配置
    service-port: 8091