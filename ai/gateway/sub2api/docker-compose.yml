version: '3.8'

services:
  sub2api:
    image: weishaw/sub2api:latest
    container_name: sub2api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_DSN=host=postgres user=sub2api password=${DB_PASSWORD} dbname=sub2api port=5432 sslmode=disable
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: sub2api-db
    restart: always
    environment:
      - POSTGRES_DB=sub2api
      - POSTGRES_USER=sub2api
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sub2api-redis
    restart: always
    volumes:
      - ./data/redis:/data
