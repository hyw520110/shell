# AI工具配置文件

# 定义要管理的工具
# 格式: 命令:显示名称:包名:类型:配置文件路径
tools=(
    "qwen:Qwen CLI:qwen-cli:npm:$HOME/.config/qwen/settings.json"
    "gemini:Gemini CLI:gemini:npm:$HOME/.config/gemini/settings.json"
    "opencode:OpenCode AI:opencode-ai:npm:$HOME/.config/opencode/settings.json"
)

# MCP服务器配置
# 格式: 名称:显示名称:包名:安装类型
mcp_servers=(
    "chrome-devtools:Chrome DevTools:npx chrome-devtools-mcp@latest:npm"
    "mysql:MySQL 数据库:npx @f4ww4z/mcp-mysql-server:npm"
)

# 文档目录
docs_dir="./ai-docs"