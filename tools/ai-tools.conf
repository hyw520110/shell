# AI Tools Configuration
# 工具列表配置

# 工具配置数组 (格式: command:name:package:type:config_path)
tools=(
  "qwen:Qwen CLI:qwen:npm:$HOME/.qwen/settings.json"
  "gemini:Gemini CLI:gemini:npm:$HOME/.gemini/settings.json"
  "claude:Claude Code:@anthropic-ai/claude-code:npm:"
  "codex:OpenAI Codex CLI:@openai/codex:npm:"
  "grok:Grok CLI:@vibe-kit/grok-cli:npm:"
  "codebuddy:Codebuddy Code:@tencent-ai/codebuddy-code:npm:"
  "copilot:GitHub Copilot:@github/copilot:npm:"
  "iflow:iFlow CLI:@iflow-ai/iflow-cli:npm:"
  "gpt-cli:ChatGPT CLI:gpt-cli:npm:"
  "mistral:mistral-cli:mistral-cli:npm:"
  "perplexity:Perplexity CLI:perplexity-cli:npm:"
  "neovate:Neovate CLI:@neovate/code:npm:"
  "qodercli:Qoder CLI:@qoder-ai/qodercli:npm:"
)

# MCP 服务器配置 (格式: name:display_name:package:install_type)
mcp_servers=(
  "chrome-devtools:Chrome DevTools:chrome-devtools-mcp@latest:npm"
  "playwright:Playwright:@playwright/mcp@latest:npm"
  "mysql:MySQL:@f4ww4z/mcp-mysql-server:npm"
)

# MCP 配置
mcp_chromedevtools='{"command": "npx", "args": ["chrome-devtools-mcp@latest", "--executablePath=/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"], "transportType": "stdio"}'
mcp_playwright='{"command": "npx", "args": ["@playwright/mcp@latest"], "transportType": "stdio"}'
mcp_mysql='{"command": "npx", "args": ["-y", "@f4ww4z/mcp-mysql-server"], "transportType": "stdio"}'

# 文档配置
docs_dir="./ai-docs"

