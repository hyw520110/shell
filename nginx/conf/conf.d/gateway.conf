server {
    listen 80;
    # 根据实际情况修改域名
    server_name 192.168.0.103 localhost; 

    # 隐藏服务器版本号
    server_tokens off;

    # 后端gateway反向代理配置
    location /api/ {
    	# 跨域配置，生产环境配置前端域名
        add_header 'Access-Control-Allow-Origin' *;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
	    # 允许前端携带的请求头
        add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
        # 允许浏览器访问的响应头
	    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
	    # 允许携带Cookie
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            # 直接返回204 No Content，表示预检通过，不将请求转发到后端
            return 204;
        }
        proxy_pass http://gateway; # 使用 upstream 名称
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 提升性能的长连接设置
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 允许常用的HTTP方法
        proxy_method      $request_method;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        
        # 显式允许所有HTTP方法
        limit_except GET HEAD POST OPTIONS {
            allow all;
        }
    }

    # 前端Web应用配置
    location / {
        root /opt/nginx/html;
        try_files $uri $uri/ /index.html;
        # 安全配置
        # uploads|templets|data 这些目录禁止执行PHP
        location ~* ^/(uploads|templets|data)/.*\.(php|php5)$ {
            return 444;
        }
	    # 代理相关的头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

    }

    # 安全增强
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # 防止文件下载
    location ~ \.(zip|rar|sql|bak|gz|7z)$ {
        return 444;
    }

    # 禁用非必要的方法 444状态是服务器直接中断连接，不会向客户端再返回任何消息，比返回403更加暴力
    if ( $request_method !~ ^(GET|HEAD|POST|OPTIONS)$ ) {
      return 444;
    }

    # 日志格式
    access_log /var/log/nginx/gateway_access.log main;
    error_log /var/log/nginx/gateway_error.log notice;

    client_max_body_size 1024m;
}
