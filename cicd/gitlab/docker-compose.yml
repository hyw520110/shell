version: '3.8'

services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION:-16.6.0}
    container_name: gitlab
    hostname: ${GITLAB_DOMAIN:-gitlab.local}
    restart: unless-stopped
    ports:
      - "${GITLAB_PORT:-80}:80"
      - "${GITLAB_SSH_PORT:-22}:22"
      - "8443:443"
    environment:
      - GITLAB_OMNIBUS_CONFIG=external_url 'http://${GITLAB_DOMAIN:-gitlab.local}:${GITLAB_PORT:-80}'
      - GITLAB_ROOT_PASSWORD=${GITLAB_ROOT_PASSWORD:-gitlab123}
      - GITLAB_ROOT_EMAIL=${GITLAB_ROOT_EMAIL:-admin@example.com}
      - TZ=Asia/Shanghai
    volumes:
      - ./data/config:/etc/gitlab
      - ./data/logs:/var/log/gitlab
      - ./data/data:/var/opt/gitlab
    shm_size: '256m'
    networks:
      - gitlab-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

  gitlab-runner:
    image: gitlab/gitlab-runner:${GITLAB_RUNNER_VERSION:-latest}
    container_name: gitlab-runner
    restart: unless-stopped
    volumes:
      - ./data/runner:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gitlab:
        condition: service_healthy
    networks:
      - gitlab-network

networks:
  gitlab-network:
    driver: bridge
