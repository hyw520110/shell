server {
    listen 80;
    # 使用实际的IP地址或域名替换占位符
    server_name localhost _;  # 推荐使用具体域名，如 yourdomain.com

    # 隐藏服务器版本号
    server_tokens off;
    
    # 基本安全头 - 避免与主配置重复
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # 添加内容安全策略
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;

    # HTTPS 重定向（如果需要）
    # listen 443 ssl http2;
    # ssl_certificate /path/to/certificate.crt;
    # ssl_certificate_key /path/to/private.key;

    # 后端gateway反向代理配置
    location /api/ {
        # 请求频率限制
        limit_req zone=general burst=10 nodelay;
        
        # 跨域配置，生产环境配置前端域名
        # add_header 'Access-Control-Allow-Origin' *;
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        # 允许前端携带的请求头
        # add_header 'Access-Control-Allow-Headers' 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';
        # 允许浏览器访问的响应头
        # add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
        # 允许携带Cookie
        # add_header 'Access-Control-Allow-Credentials' 'true' always;
        
        # 处理OPTIONS预检请求 - 如有后端网关应注释掉 
        # if ($request_method = 'OPTIONS') {
            # 直接返回204 No Content，表示预检通过，不将请求转发到后端
        #    return 204;
        # }
        
        # 代理到上游服务器（使用统一的upstream配置）
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 提升性能的长连接设置
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # 滚动发布期间某个 Gateway 短暂退出时，将可安全重试的请求转给另一节点。
        # 不开启 proxy_next_upstream_non_idempotent，避免 POST 等请求被重复提交。
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # 允许常用的HTTP方法
        proxy_method      $request_method;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
    }

    # 前端Web应用配置
    location / {
        root /opt/nginx/html;
        try_files $uri $uri/ /index.html;
        
        # 请求频率限制
        limit_req zone=general burst=20 nodelay;
        
        # 安全配置
        # uploads|templets|data 这些目录禁止执行PHP
        location ~* ^/(uploads|templets|data)/.*\.(php|php5)$ {
            return 444;
        }
        
        # 防止文件下载
        location ~ \.(zip|rar|sql|bak|gz|7z)$ {
            return 444;
        }
        
        # 代理相关的头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    # 代理到MinIO服务器                                                                                                                                                   
    location /upload/cmp/ {                                                                                                                                                   
         # 代理到MinIO，重写路径以去除/upload/cmp/前缀                                                                                                                         
         rewrite ^/upload/cmp/(.*) /$1 break;                                                                                                                                  
         proxy_pass http://minio-server:9000;  # 转发到MinIO服务器                                                                                                                         
                                                                                                                                                                               
         # MinIO访问设置                                                                                                                                                       
         proxy_set_header Host $host;                                                                                                                                          
         proxy_set_header X-Real-IP $remote_addr;                                                                                                                              
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;                                                                                                          
         proxy_set_header X-Forwarded-Proto $scheme;                                                                                                                           
                                                                                                                                                                               
         # 关闭代理缓冲，处理大文件                                                                                                                                            
         proxy_buffering off;                                                                                                                                                  
         proxy_request_buffering off;                                                                                                                                          
                                                                                                                                                                               
         # 设置超时时间                                                                                                                                                        
         proxy_connect_timeout 60s;                                                                                                                                            
         proxy_send_timeout 60s;                                                                                                                                               
         proxy_read_timeout 60s;                                                                                                                                               
                                                                                                                                                                               
         # 添加安全头                                                                                                                                                          
         add_header X-Content-Type-Options "nosniff" always;                                                                                                                   
                                                                                                                                                                               
         # 设置缓存控制                                                                                                                                                        
         expires 1y;                                                                                                                                                           
         add_header Cache-Control "public, immutable" always;                                                                                                                  
    }       
    # 上传目录访问规则 - 对应用户目录下的uploads
#     location ~/uploads/ {
#         # 使用alias映射到统一的上传目录
#         alias /opt/nginx/uploads/;
#         
#         # 限制访问方法
#         limit_except GET POST {
#             deny all;
#         }
#         
#         # 设置上传文件的访问权限
#         location ~ \.(php|php5|phtml|pl|py|jsp|asp|sh|cgi)$ {
#             # 禁止执行脚本文件
#             return 403;
#         }
#         
#         # 防止访问隐藏文件
#         location ~ /\.. {
#             deny all;
#             access_log off;
#             log_not_found off;
#         }
#         
#         # 防止访问备份文件和临时文件
#         location ~ \.(bak|backup|old|tmp|temp)$ {
#             deny all;
#             access_log off;
#             log_not_found off;
#         }
#         
#         # 设置客户端最大上传文件大小
#         client_max_body_size 50M;
#         
#         # 设置上传超时时间
#         client_body_timeout 60s;
#         
#         # 启用请求频率限制
#         limit_req zone=general burst=5 nodelay;
#         
#         # 添加安全头
#         add_header X-Content-Type-Options "nosniff" always;
#         add_header X-Frame-Options "DENY" always;
#         
#         # 设置缓存控制
#         expires 1y;
#         add_header Cache-Control "public, immutable" always;
#     }

    # 安全增强
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 禁用非必要的方法 444状态是服务器直接中断连接，不会向客户端再返回任何消息，比返回403更加暴力
    if ( $request_method !~ ^(GET|HEAD|POST|PUT|DELETE|PATCH|OPTIONS)$ ) {
      return 444;
    }

    # 日志格式
    access_log /var/log/nginx/gateway_access.log main buffer=32k flush=5m;
    error_log /var/log/nginx/gateway_error.log notice;

    # 限制请求大小
    client_max_body_size 50M;  # 统一设置为50M，与主配置保持一致
}
