
#user dev;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    # 系统需执行:ulimit -n 65536 或永久设置修改：/etc/security/limits.conf 增加配置：
    # * soft nofile 65536
    # * hard nofile 65536
    worker_connections  65535;
    # 提高网络性能
    use epoll;
    multi_accept on;
    accept_mutex off;
}


http {
    include       /opt/nginx/conf/mime.types;
    default_type  application/octet-stream;

    # 扩展日志格式，包含更多有用信息
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '"$request_time" "$upstream_response_time"';
    
    log_format detailed_log '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'rt=$request_time uct="$upstream_connect_time" '
                            'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # 隐藏Nginx后端服务X-Powered-By头
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_headers_hash_max_size 512;
    proxy_headers_hash_bucket_size 128;
    
    # 请求自适应，内网转发gateway_local否则转发gateway_remote
    map $server_name $target_gateway {
        default "gateway_remote";
        ~^(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|127\.0\.0\.1|localhost)$ "gateway_local";
    }
    # 禁止访问的ip黑名单conf.d/ip-black.conf,根据特定规则(php请求和频繁访问ip)进行定时检测屏蔽(脚本bin/ngx-ip-black.sh)
    include conf.d/ip-black.conf;
    
    # 设置用户目录访问权限
    # 允许nginx用户访问用户主目录
    # 注意：在生产环境中，应该更严格地控制此权限  

    # 性能优化
    sendfile        on;
    tcp_nopush     on;  # 在大多数情况下开启会有更好的性能
    tcp_nodelay    on;
    # 调整缓冲区设置
    client_body_buffer_size 128k;
    client_header_buffer_size 32k;
    large_client_header_buffers 4 64k;
    output_buffers 1 32k;
    postpone_output 1460;

    keepalive_timeout  65;
    keepalive_requests 1000;

    # Gzip压缩优化
    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 6;    # 平衡压缩率和CPU使用
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/javascript 
        application/x-javascript 
        application/json 
        application/xml 
        application/xml+rss 
        application/xhtml+xml 
        application/x-font-ttf 
        application/x-font-opentype 
        image/svg+xml 
        image/x-icon;
    gzip_vary on;
    gzip_proxied any;
    gzip_buffers 16 8k;

    # 安全增强
    server_tokens off;  # 隐藏版本号
    
    # 基本安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    
    # 内容安全策略 (可根据实际需求调整)
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;
    
    # 严格的传输安全 (如果使用HTTPS)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 限制请求大小
    client_max_body_size 50M;
    
    # 请求处理超时
    client_header_timeout 60s;
    client_body_timeout 60s;
    send_timeout 60s;
    
    # SSL/TLS 配置 (注释形式)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    
    # 限制请求频率 (基础防护)
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;

    # 包含统一的upstream配置
    include conf.d/*.app;
    include conf.d/*.conf; 
    
#    error_page   500 502 503 504  /50x.html;
#    location = /50x.html {
#       root  html;
#    }
}
