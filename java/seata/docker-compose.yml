version: '3.8'

services:
  seata-server:
    image: seataio/seata-server:2.5.0  # 使用特定版本
    hostname: seata-server
    container_name: seata-server
    ports:
      - "8091:8091"
    env_file:
      - .env
    volumes:
      - ./logs:/root/logs
      - ./conf:/root/conf
    depends_on:
      - mysql-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - seata-net

  mysql-server:
    image: mysql:8.0
    container_name: mysql-server
    ports:
      - "3306:3306"
    env_file:
      - .env
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - seata-net

networks:
  seata-net:
    driver: bridge

volumes:
  mysql-data: