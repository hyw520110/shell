version: '3.8'

services:
  nexus:
    image: sonatype/nexus3:${NEXUS_VERSION:-3.65.0}
    container_name: nexus
    hostname: nexus
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-8081}:8081"
    volumes:
      - ./data:/nexus-data
      - ./nexus-data:/opt/sonatype/nexus
    environment:
      - INSTALL4J_ADD_VM_PARAMS=-Xms512m -Xmx1g -Djava.util.prefs.userRoot=/nexus-data -Duser.dir=/opt/sonatype/nexus
      - TZ=Asia/Shanghai
    networks:
      - nexus-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

networks:
  nexus-network:
    driver: bridge
